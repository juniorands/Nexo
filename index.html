      <button class="btn danger" data-act="delItem" data-id="${it.id}">${ic('trash')} Eliminar</button>
      <button class="btn primary" data-act="saveItem" data-id="${it.id}">Guardar</button>
    </div>`);
}
function saveItem(id) {
  const it = getItem(id);
  if (!it) return;
  const title = $('#edTitle').value.trim();
  if (!title) return toast('El título no puede estar vacío');
  snapshot();
  Object.assign(it, {
    title, cat: $('#edCat').value, notes: $('#edNotes').value.trim(),
    date: isYmd($('#edDate').value) ? $('#edDate').value : '',
    repeat: $('#edYearly').checked ? 'yearly' : '', updated: Date.now(),
  });
  if (it.pkey) { delete S.profile[it.pkey]; delete it.pkey; }
  save(); closeSheet(); render(); toast('Guardado', { undo: true });
}

/* Editor de listas: nombre, icono, color, orden */
function openCatEditor(id) {
  const c = id ? cat(id) : null;
  const icon = c?.icon || 'folder', color = c ? catColor(c) : 'dark';
  const idx = c ? S.cats.indexOf(c) : -1;
  openSheet(`
    <h3>${c ? 'Editar lista' : 'Nueva lista'}</h3>
    <label class="lbl" for="ceName">Nombre</label>
    <input class="in" id="ceName" value="${esc(c?.name || '')}" placeholder="Ej: Casa, Gym, Samantha…">
    <label class="lbl">Icono</label>
    <div class="icon-grid">${LIST_ICONS.map((n) => `<button type="button" class="icon-opt ${n === icon ? 'on' : ''}" data-pick-icon="${n}" aria-label="${n}">${ic(n)}</button>`).join('')}</div>
    <label class="lbl">Color</label>
    <div class="swatches">${COLORS.map((cl) => `<button type="button" class="sw t-${cl} ${cl === color ? 'on' : ''}" data-pick-color="${cl}" aria-label="${COLOR_NAMES[cl]}"></button>`).join('')}</div>
    ${c ? `<label class="lbl">Orden</label>
    <div class="pv-row"><button class="btn" data-act="catMove" data-id="${c.id}" data-dir="-1" ${idx === 0 ? 'disabled' : ''}>${ic('up')} Subir</button>
      <button class="btn" data-act="catMove" data-id="${c.id}" data-dir="1" ${idx === S.cats.length - 1 ? 'disabled' : ''}>${ic('down')} Bajar</button></div>` : ''}
    <div class="sheet-actions">
      ${c && !c.system ? `<button class="btn danger" data-act="delCat" data-id="${c.id}">${ic('trash')} Eliminar</button>` : '<button class="btn" data-close>Cancelar</button>'}
      <button class="btn primary" data-act="saveCat" data-id="${c?.id || ''}">Guardar</button>
    </div>`);
  if (!c) setTimeout(() => $('#ceName').focus(), 250);
}
function saveCat(id) {
  const name = $('#ceName').value.trim();
  if (!name) return toast('Ponle un nombre');
  const icon = $('#sheet .icon-opt.on')?.dataset.pickIcon || 'folder';
  const color = $('#sheet .sw.on')?.dataset.pickColor || 'dark';
  snapshot();
  if (id) Object.assign(cat(id), { name, icon, color });
  else { const f = findCat(name); if (f) Object.assign(f, { icon, color }); else ensureCategory(name, icon, color); }
  save(); closeSheet(); render(); toast('Lista guardada', { undo: true });
}

/* ============================== acciones ============================== */
async function runNexo(text, btn, img = null) {
  setBusy(btn, true);
  try { return await aiCommand(text, img, chatHistory(), (st) => setBusy(btn, true, st)); }
  catch (e) { toast(e.message, { ms: 4000 }); return null; }
  finally { setBusy(btn, false); }
}
function chatHistory() {
  return CHAT.filter((m) => !m.thinking && m.text).slice(-10)
    .map((m) => ({ role: m.role === 'me' ? 'user' : 'model', parts: [{ text: m.text }] }));
}
async function doCapture(btn) {
  const text = $('#capText').value.trim();
  const img = pendingImg;
  if (!text && !img) return toast('Escribe algo o agrega una foto');
  const clear = () => { pendingImg = null; const t = $('#capText'); if (t) t.value = ''; };
  if (!hasAI()) {
    if (img) return toast('Para leer fotos, conecta Gemini en Ajustes');
    return openReview(localClassify(text), '', clear);
  }
  const r = await runNexo(text, btn, img);
  if (!r) { if (text) openReview(localClassify(text), 'Sin IA en este momento: revisa antes de guardar.', clear); return; }
  if (r.actions.length) return openReview(r.actions, r.reply, clear);
  // sin cambios: fue una pregunta → la respuesta va al chat
  CHAT.push({ role: 'me', text: text || '(imagen)' }, botMsg(r, { text: r.reply || 'No encontré nada que guardar.' }));
  pendingImg = null;
  go('ask');
}
async function doAsk(q) {
  q = q.trim(); if (!q) return;
  if (!hasAI()) {
    CHAT.push({ role: 'me', text: q });
    const found = localSearch(q);
    CHAT.push({ role: 'bot', text: '', html: found.length
      ? `<p>Encontré esto en tu memoria:</p><div class="list" style="padding:0">${found.map((i) => itemRow(i)).join('')}</div>`
      : '<p>No encontré nada con esas palabras. Conecta Gemini en Ajustes para respuestas más inteligentes.</p>' });
    return render();
  }
  const history = chatHistory();
  CHAT.push({ role: 'me', text: q });
  const thinking = { role: 'bot', thinking: true, t0: Date.now() };
  CHAT.push(thinking); render();
  try {
    const r = await aiCommand(q, null, history, (st) => { thinking.status = st; if (UI.tab === 'ask') render(); });
    Object.assign(thinking, botMsg(r, { thinking: false, text: r.reply || (r.actions.length ? 'Te propongo estos cambios.' : 'Listo.') }));
  } catch (e) {
    Object.assign(thinking, { thinking: false, text: 'Hubo un problema: ' + e.message });
  }
  if (UI.tab === 'ask') render();
}
async function askAbout(prefix, input, btn) {
  const t = input.value.trim();
  if (!t) return toast('Escribe qué quieres que haga Nexo');
  const r = await runNexo(`${prefix} ${t}`, btn);
  if (!r) return;
  if (r.actions.length) { closeSheet(); openReview(r.actions, r.reply, () => { input.value = ''; }); }
  else if (r.sources?.length || r.links?.length || r.products?.length) { closeSheet(); input.value = ''; CHAT.push({ role: 'me', text: t }, botMsg(r)); go('ask'); }
  else toast(r.reply || 'No encontré cambios que hacer', { ms: 5000 });
}

async function fileToJpeg(file, max = 2400) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    let w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const data = c.toDataURL('image/jpeg', 0.85);
    return { mimeType: 'image/jpeg', data: data.split(',')[1], preview: data };
  } finally { URL.revokeObjectURL(url); }
}
async function shareOrDownload(name, text, type, preferShare) {
  const blob = new Blob([text], { type });
  if (preferShare) {
    try {
      const file = new File([blob], name, { type });
      if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function icsFor(it) {
  const e = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const start = parseYmd(it.date); const end = new Date(start); end.setDate(end.getDate() + 1);
  const f = (d) => ymd(d).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nexo//ES', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${it.id}@nexo`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${f(start)}`, `DTEND;VALUE=DATE:${f(end)}`,
    `SUMMARY:${e(it.title)}`, it.notes ? `DESCRIPTION:${e(it.notes)}` : '', it.repeat === 'yearly' ? 'RRULE:FREQ=YEARLY' : '',
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(it.title)}`, 'TRIGGER:-PT15H', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}

const ACTIONS = {
  undo: () => undo(),
  mic: (el) => toggleMic(el),
  brief: () => { go('ask'); doAsk('Dame mi brief de hoy: lo más importante en 3 a 5 puntos, qué hago primero y una sugerencia proactiva basada en mi memoria (fechas que vienen, regalos, compras pendientes). Directo y sin relleno.'); },
  goSettings: () => go('settings'),
  goLists: () => go('lists'),
  capture: (el) => doCapture(el),
  hint: (el) => { const t = $('#capText'); t.value = el.textContent.replace(/…$/, ' '); t.focus(); },
  imgPick: () => $('#fileImg').click(),
  imgRemove: () => { const keep = $('#capText')?.value || ''; pendingImg = null; render(); $('#capText').value = keep; },
  paste: async () => {
    try { const t = await navigator.clipboard.readText(); if (!t) return toast('El portapapeles está vacío'); const ta = $('#capText'); ta.value = (ta.value ? ta.value + '\n' : '') + t; ta.focus(); }
    catch { toast('Mantén presionado el cuadro de texto y elige "Pegar"'); }
  },
  check: (el) => {
    const it = getItem(el.dataset.id); if (!it) return;
    snapshot(); it.done = !it.done; it.updated = Date.now(); save(); render();
    toast(it.done ? 'Hecho' : 'Pendiente otra vez', { undo: true });
  },
  open: (el) => openItem(el.dataset.id),
  saveItem: (el) => saveItem(el.dataset.id),
  delItem: (el) => {
    const it = getItem(el.dataset.id); if (!it) return;
    snapshot();
    if (it.pkey) delete S.profile[it.pkey];
    S.items = S.items.filter((i) => i !== it); save(); closeSheet(); render();
    toast('Eliminado', { undo: true });
  },
  ics: (el) => { const it = getItem(el.dataset.id); if (it) shareOrDownload('recordatorio.ics', icsFor(it), 'text/calendar', false); },
  cat: (el) => go('lists', { cat: el.dataset.id, showDone: false }),
  back: () => go('lists'),
  diag: () => runDiag(),
  saveProd: (el) => saveProducts(+el.dataset.i, [+el.dataset.j]),
  saveAllProd: (el) => saveProducts(+el.dataset.i, CHAT[+el.dataset.i].products.map((p, j) => (p.saved ? -1 : j)).filter((j) => j >= 0)),
  saveTavily: async (el) => {
    const k = $('#tavIn').value.trim();
    if (!k) return toast('Pega tu clave de Tavily');
    setBusy(el, true, 'Probando…');
    try { await tavilySearch('perfume Carolina Herrera Good Girl precio', k); lsSet(TAVILY_STORE, k); toast('Tavily conectado: Nexo ya busca en internet'); render(); }
    catch (e) { toast(e.message, { ms: 4500 }); setBusy(el, false); }
  },
  removeTavily: () => { if (!confirm('¿Quitar la clave de Tavily de este teléfono?')) return; lsDel(TAVILY_STORE); render(); },
  closeSheet: () => closeSheet(),
  toggleDone: () => { UI.showDone = !UI.showDone; render(); },
  webToggle: (el) => { lsSet(WEB_STORE, el.checked ? 'on' : 'off'); toast(el.checked ? 'Búsqueda en internet activada' : 'Búsqueda en internet desactivada'); render(); },
  geoToggle: async (el) => {
    if (!el.checked) { lsSet(GEO_ON, 'off'); render(); return toast('Ubicación actual desactivada'); }
    try { lsSet(GEO_ON, 'on'); const g = await refreshGeo(true); toast(`Ubicación: ${g.comuna || 'leída'}`); }
    catch (e) { lsSet(GEO_ON, 'off'); toast(e.message, { ms: 6000 }); }
    render();
  },
  geoNow: async (el) => {
    setBusy(el, true, 'Leyendo…');
    try { const g = await refreshGeo(true); toast(`Ubicación: ${g.comuna || 'leída'}`); render(); }
    catch (e) { toast(e.message, { ms: 6000 }); setBusy(el, false); }
  },
  saveWhere: () => { snapshot(); S.profile.shopWhere = $('#whereIn').value.trim(); save(); toast('Ubicación guardada'); },
  clearDone: (el) => {
    snapshot();
    S.items = S.items.filter((i) => !(i.cat === el.dataset.id && i.done)); save(); render();
    toast('Completados borrados', { undo: true });
  },
  newCat: () => openCatEditor(null),
  editCat: (el) => openCatEditor(el.dataset.id),
  saveCat: (el) => saveCat(el.dataset.id),
  catMove: (el) => {
    const i = S.cats.findIndex((c) => c.id === el.dataset.id), j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= S.cats.length) return;
    [S.cats[i], S.cats[j]] = [S.cats[j], S.cats[i]]; save(); render();
    // mantener abiertos los cambios no guardados de nombre/icono/color
    const keep = { name: $('#ceName').value, icon: $('#sheet .icon-opt.on')?.dataset.pickIcon, color: $('#sheet .sw.on')?.dataset.pickColor };
    openCatEditor(el.dataset.id);
    $('#ceName').value = keep.name;
    if (keep.icon) { $$('#sheet .icon-opt').forEach((b) => b.classList.toggle('on', b.dataset.pickIcon === keep.icon)); }
    if (keep.color) { $$('#sheet .sw').forEach((b) => b.classList.toggle('on', b.dataset.pickColor === keep.color)); }
  },
  delCat: (el) => {
    snapshot(); removeList(el.dataset.id); save(); closeSheet(); go('lists');
    toast('Lista eliminada', { undo: true });
  },
  reviewApply: () => applyReview(),
  listAsk: (el) => askAbout(`En la lista [lista id:${UI.cat}] "${catName(UI.cat)}":`, $('#quickIn'), el),
  suggest: (el) => doAsk(el.textContent),
  chatReview: (el) => {
    const m = CHAT[+el.dataset.i]; if (!m?.actions?.length) return;
    openReview(m.actions, '', () => { m.applied = true; });
  },
  saveKey: async (el) => {
    const k = $('#keyIn').value.trim();
    if (!k) return toast('Pega tu clave primero');
    const sel = $('#modelSel');
    setBusy(el, true, 'Probando…');
    try {
      await connectKey(k);
      if (sel && MODELS.includes(sel.value)) lsSet(MODEL_STORE, sel.value);
      toast('Gemini conectado'); render();
    } catch (e) { toast(e.message, { ms: 4000 }); setBusy(el, false); }
  },
  removeKey: () => { if (!confirm('¿Quitar la clave de Gemini de este teléfono?')) return; lsDel(KEY_STORE); MODELS = []; render(); },
  redoOnb: () => openOnboarding(1),
  avatarPick: () => $('#fileAvatar').click(),
  avatarReset: () => { lsDel(AVATAR_STORE); render(); },
  export: () => shareOrDownload(`nexo-respaldo-${ymd(new Date())}.json`, JSON.stringify(S, null, 2), 'application/json', true),
  import: () => $('#fileBackup').click(),
  wipe: () => {
    if (!confirm('Esto borra TODA tu memoria de este teléfono y no se puede deshacer. ¿Seguro? (Exporta un respaldo antes si lo necesitas)')) return;
    S = freshData(); save(); CHAT = []; UNDO = null; openOnboarding(0);
  },
};

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) return go(tab.dataset.tab);
  const onb = e.target.closest('[data-onb]');
  if (onb) return onbAction(onb.dataset.onb);
  const pi = e.target.closest('[data-pick-icon]');
  if (pi) { $$('[data-pick-icon]', pi.parentElement).forEach((b) => b.classList.toggle('on', b === pi)); return; }
  const pc = e.target.closest('[data-pick-color]');
  if (pc) { $$('[data-pick-color]', pc.parentElement).forEach((b) => b.classList.toggle('on', b === pc)); return; }
  if (e.target.closest('[data-close]')) return closeSheet();
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a); }
});
document.addEventListener('change', (e) => {
  const d = e.target.closest('[data-dest]'); if (d && CHAT[+d.dataset.dest]) CHAT[+d.dataset.dest].dest = d.value;
});
document.addEventListener('submit', (e) => {
  const form = e.target, f = form.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'quickAdd') {
    const v = $('#quickIn').value.trim(); if (!v) return;
    addItem({ title: v, cat: UI.cat }); save(); render();
    setTimeout(() => $('#quickIn')?.focus(), 0);
  } else if (f === 'ask') {
    const v = $('#askIn').value; $('#askIn').value = ''; doAsk(v);
  } else if (f === 'itemAsk') {
    const it = getItem(form.dataset.id); if (!it) return;
    askAbout(`Sobre el elemento [id:${it.id}] "${it.title}":`, $('#edAsk'), $('button', form));
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'onbIn' && e.target.tagName === 'INPUT') { e.preventDefault(); onbAction('next'); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
});
$('#fileImg').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const keep = $('#capText')?.value || '';
  try { pendingImg = await fileToJpeg(f); render(); $('#capText').value = keep; }
  catch { toast('No pude abrir esa imagen'); }
});
$('#fileAvatar').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const j = await fileToJpeg(f, 360);
    if (!lsSet(AVATAR_STORE, j.preview)) throw new Error();
    render(); toast('Avatar actualizado');
  } catch { toast('No pude usar esa imagen'); }
});
$('#fileBackup').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.cats)) throw new Error();
    if (!confirm(`Este respaldo tiene ${d.items.length} elementos. Reemplazará tu memoria actual. ¿Continuar?`)) return;
    snapshot(); S = migrate(d); S.onboarded = true; save(); render(); toast('Respaldo importado', { undo: true });
  } catch { toast('Ese archivo no es un respaldo válido'); }
});

/* ============================== inicio ============================== */
save();
render();
if (!S.onboarded) openOnboarding(0);
if (geoOn() && navigator.permissions?.query) navigator.permissions.query({ name: 'geolocation' }).then((p) => { if (p.state === 'granted') refreshGeo().catch(() => {}); }).catch(() => {});
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Siempre busca la versión nueva (sin caché) y, si llega una, recarga sola una vez.
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => reg.update()).catch(() => {}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !navigator.serviceWorker.controller) return; reloaded = true; location.reload(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then((r) => r?.update()).catch(() => {}); });
}
