<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Nexo</title>
<style>
/* Nexo · estilo Jr: grafito, menta, violeta eléctrico, degradado azul */
:root{
  --bg:#141416; --surface:#1e1e20; --surface2:#2a2a2e; --line:#323237; --text:#f4f4f8; --muted:#a6a6bc; --faint:#7d7d90;
  --mint:#8af795; --mint-ink:#0f1a11; --violet:#6a00ff; --violet-l:#a98aff; --blue:#1010ff; --lav:#dadaf0; --lav-ink:#1e1e20;
  --danger:#ff6b6b; --warn:#ffc857;
  --grad:linear-gradient(155deg,#6a00ff 0%,#1010ff 58%,#3d8bff 82%,#8af795 125%);
  --radius:22px; --tabbar:66px;
  --font:'Outfit',-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0; color:var(--text); background:transparent;
  font:400 17px/1.4 var(--font);
  padding:env(safe-area-inset-top) 0 calc(var(--tabbar) + env(safe-area-inset-bottom) + 18px);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; left:-30%; right:-30%; top:-25vh; height:70vh; z-index:-1; pointer-events:none;
  background:
    radial-gradient(38% 45% at 22% 40%, rgba(106,0,255,.42), transparent 70%),
    radial-gradient(34% 42% at 78% 30%, rgba(16,16,255,.32), transparent 70%),
    radial-gradient(26% 34% at 52% 70%, rgba(138,247,149,.12), transparent 70%);
  filter:blur(28px);
}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
a{color:var(--mint)}
#view{max-width:640px; margin:0 auto; padding:0 16px}
h1,h2,h3{font-family:var(--font); font-weight:600}

/* iconos */
.ic{width:20px; height:20px; flex:none; display:block}
.ic.xs{width:13px; height:13px; display:inline-block; vertical-align:-2px}
.ic.sm{width:16px; height:16px}
.ic.lg{width:24px; height:24px}

.top{padding:18px 2px 6px; position:relative}
.top h1{font-size:34px; line-height:1.1; margin:0; letter-spacing:-.025em}
.eyebrow{font-size:12px; font-weight:600; color:var(--mint); text-transform:uppercase; letter-spacing:.12em}
.home-top{display:flex; align-items:flex-end; gap:12px; padding-top:22px}
.home-top .hello{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.avatar{flex:none; width:52px; height:52px; border-radius:99px; overflow:hidden; background:var(--lav); box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--mint)}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.top-row{display:flex; align-items:center; gap:8px; padding:14px 0 4px}
.top-row h1{font-size:28px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.02em}
.back{color:var(--mint); font-size:17px; padding:6px 2px; display:flex; align-items:center; gap:2px}
.sec{font-size:21px; margin:28px 2px 12px; letter-spacing:-.015em}
.sec-row{display:flex; align-items:baseline; justify-content:space-between}
.sec-row .link{color:var(--mint); font-size:15px; font-weight:500; display:flex; align-items:center; gap:4px}
.card{background:var(--surface); border-radius:var(--radius); padding:14px}
.list{padding:0 0 0 14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty{color:var(--muted); font-size:15px; padding:14px 16px; margin:0; border:1px dashed var(--line); border-radius:var(--radius)}

/* inputs */
.in{width:100%; background:var(--surface2); border:1px solid transparent; border-radius:14px; padding:12px 14px; font-size:16px; outline:none}
.in:focus{border-color:var(--violet-l)}
.in::placeholder{color:var(--faint)}
textarea.in{resize:none}
select.in{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px}
input[type=date].in{min-height:46px}
label.lbl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:16px 2px 7px; text-transform:uppercase; letter-spacing:.1em}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:46px; padding:0 18px; border-radius:14px; background:var(--surface2); font-weight:600; font-size:16px}
.btn.primary{background:var(--mint); color:var(--mint-ink)}
.btn.ai{background:var(--grad); color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sq{width:46px; padding:0; flex:none}
.btn[disabled]{opacity:.55}
.btn .ic{width:18px; height:18px}
.icon-btn{width:46px; height:46px; border-radius:14px; background:var(--surface2); display:inline-flex; align-items:center; justify-content:center; color:var(--muted)}
.icon-btn .ic{width:22px; height:22px}

/* capture */
.capture{border:1px solid transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--grad) border-box; margin-top:14px}
.capture textarea{border:0; background:transparent; padding:2px 2px 8px; font-size:17px; min-height:80px; width:100%; outline:none; resize:none}
.capture textarea::placeholder{color:var(--faint)}
.capture .row{display:flex; align-items:center; gap:8px}
.capture .row .btn{margin-left:auto}
.ai-pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:6px 10px; border-radius:99px; background:var(--surface2); color:var(--muted)}
.ai-pill.on{background:rgba(106,0,255,.22); color:var(--violet-l)}
.ai-pill .ic{width:12px; height:12px}
.cap-img{position:relative; margin:4px 0 10px}
.cap-img img{max-height:140px; max-width:100%; border-radius:12px; display:block}
.cap-img button{position:absolute; top:6px; left:6px; width:28px; height:28px; border-radius:99px; background:rgba(0,0,0,.7); color:#fff; display:flex; align-items:center; justify-content:center}
.icon-btn.rec{background:var(--danger); color:#fff; animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,107,.18)}}
.focus{padding:6px 14px}
.sig{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; text-align:left; width:100%}
.sig:last-child{border-bottom:0}
.sig .ic{margin-top:2px; color:var(--mint)}
.sig.warn .ic{color:var(--danger)}
.sig.soon .ic{color:var(--warn)}
.sig b{font-weight:600}
.brief-btn{display:flex; align-items:center; gap:8px; width:100%; justify-content:center; margin-top:10px}
.hints{display:flex; gap:8px; overflow-x:auto; margin:10px -16px 0; padding:0 16px; scrollbar-width:none}
.hints::-webkit-scrollbar{display:none}
.hint{flex:none; font-size:13px; padding:7px 12px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}

/* rows */
.row-item{display:flex; align-items:flex-start; gap:12px; padding:12px 14px 12px 0; border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.check{flex:none; width:26px; height:26px; margin-top:1px; border-radius:99px; border:2px solid #4a4a52; color:var(--mint-ink); display:flex; align-items:center; justify-content:center}
.check .ic{width:15px; height:15px; stroke-width:3}
.row-item.done .check{background:var(--mint); border-color:var(--mint)}
.row-item.done .ri-title{text-decoration:line-through; color:var(--muted)}
.dot{flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--muted)}
.ri-body{flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; gap:3px}
.ri-title{font-size:16px; word-wrap:break-word}
.ri-sub{font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.due{font-weight:600; color:var(--text)}
.due.soon{color:var(--warn)}
.due.over{color:var(--danger)}

/* tiles (como tu brand board) */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{border-radius:var(--radius); padding:16px; text-align:left; display:flex; flex-direction:column; gap:10px; min-height:118px; background:var(--surface); position:relative; overflow:hidden}
.tile .em{width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08)}
.tile .em .ic{width:22px; height:22px}
.tile .nm{font-weight:600; font-size:16px; line-height:1.2; letter-spacing:-.01em}
.tile .ct{font-size:13px; opacity:.7; margin-top:auto}
.t-lav{background:var(--lav); color:var(--lav-ink)}
.t-violet{background:var(--violet); color:#fff}
.t-mint{background:var(--mint); color:var(--mint-ink)}
.t-grad{background:var(--grad); color:#fff}
.t-dark{background:var(--surface); color:var(--text)}
.t-lav .em,.t-mint .em{background:rgba(0,0,0,.08)}
.t-violet .em,.t-grad .em{background:rgba(255,255,255,.16)}
.cat-row{display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px 12px 0; border-bottom:1px solid var(--line); text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row .em{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:none}
.cat-row .em.t-dark{background:var(--surface2)}
.cat-row .nm{flex:1; font-size:16px}
.cat-row .ct{color:var(--muted); font-size:15px}
.chev{color:var(--faint)}
.add-row{display:flex; gap:8px; margin:12px 0 14px}
.add-row .in{flex:1}
.toggle-done{color:var(--mint); font-size:15px; padding:14px 2px 4px}
.arcs{position:absolute; right:-16px; top:-6px; width:180px; height:120px; opacity:.5; pointer-events:none; z-index:-1}

/* chat */
.chat{display:flex; flex-direction:column; gap:12px; padding:8px 0 96px}
.bubble{max-width:84%; padding:11px 15px; border-radius:20px; font-size:16px; word-wrap:break-word}
.bubble.me{align-self:flex-end; background:var(--violet); color:#fff; border-bottom-right-radius:6px; white-space:pre-wrap}
.bot-row{display:flex; gap:8px; align-items:flex-end; max-width:92%}
.nx{flex:none; width:28px; height:28px; border-radius:9px; background:#000; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px var(--line); color:#fff}
.nx svg{width:16px; height:16px}
.bubble.bot{max-width:100%; background:var(--surface); border-bottom-left-radius:6px}
.bubble.bot ul{margin:4px 0; padding-left:20px}
.bubble.bot li{margin:2px 0}
.bubble.bot p{margin:0 0 6px}
.bubble.bot p:last-child{margin:0}
.bubble.bot b{color:var(--mint); font-weight:600}
.bubble .btn{margin-top:10px; min-height:40px; font-size:15px}
.bubble.thinking{color:var(--muted); display:flex; gap:8px; align-items:center}
.applied{font-size:13px; color:var(--mint); margin-top:8px; display:flex; gap:6px; align-items:center}
.ask-hero{display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin:14px 2px 6px}
.ask-hero .nx{width:52px; height:52px; border-radius:16px}
.ask-hero .nx svg{width:28px; height:28px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.srcs{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.src{display:inline-flex; align-items:center; gap:5px; max-width:100%; padding:5px 10px; border-radius:99px; background:var(--surface2); color:var(--lav); font-size:13px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.src .ic{width:13px; height:13px; flex:none}
.bubble.bot a.lnk, .help a.lnk{color:var(--mint); text-decoration:underline; text-underline-offset:2px}
.gse{display:block; width:100%; height:64px; border:0; margin-top:8px; border-radius:12px; background:transparent; color-scheme:dark}
.links{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.links .btn{justify-content:flex-start; font-weight:500; min-height:44px}
.links .btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:9px 14px; font-size:15px; text-align:left}
.ask-bar{position:fixed; left:0; right:0; bottom:calc(var(--tabbar) + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); padding:8px 16px; border-top:1px solid var(--line); z-index:5}
.ask-bar .wrap{max-width:608px; margin:0 auto; display:flex; gap:8px; width:100%; align-items:flex-end}
.ask-bar textarea{flex:1; max-height:140px; background:var(--surface)}

/* tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; height:calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:flex; background:color-mix(in srgb, var(--bg) 85%, transparent); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); border-top:1px solid var(--line); z-index:10}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11px; font-weight:600; color:var(--faint); position:relative}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--mint)}
.tab[aria-current="page"]::after{content:''; position:absolute; top:0; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--mint)}

/* sheet */
#sheet{position:fixed; inset:0; z-index:30}
.sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.6); animation:fade .2s}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:#19191b; border-radius:26px 26px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .28s cubic-bezier(.2,.8,.2,1); max-width:640px; margin:0 auto; border-top:1px solid var(--line)}
.sheet h3{font-size:22px; margin:8px 2px 4px; letter-spacing:-.015em}
.grab{width:40px; height:5px; border-radius:99px; background:#3a3a40; margin:0 auto 8px}
.sheet-actions{display:flex; gap:10px; margin-top:18px; position:sticky; bottom:0; background:#19191b; padding-top:8px}
.sheet-actions .btn{flex:1}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pv{display:flex; gap:10px; background:var(--surface); border-radius:18px; padding:12px; margin-top:10px}
.pv > input[type=checkbox]{width:22px; height:22px; accent-color:var(--mint); margin-top:2px; flex:none}
.pv-body{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0}
.pv-row{display:flex; gap:8px}
.pv-row > *{flex:1; min-width:0}
.pv.off .pv-body{opacity:.4}
.ch-op{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--violet-l)}
.ch-op.add{color:var(--mint)}
.ch-op.del{color:var(--danger)}
.ch-title{font-size:16px}
.ch-diff{font-size:14px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
.ch-diff b{color:var(--text); font-weight:500}
.review-reply{margin:4px 2px 0}
.review-reply p{margin:0 0 4px}
.review-reply ul{margin:4px 0; padding-left:18px}
.nexo-ask{display:flex; gap:8px; align-items:center; margin:10px 0 2px; padding:8px; border-radius:18px; border:1px solid transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--grad) border-box}
.nexo-ask .in{flex:1; background:transparent; padding:10px 6px}
.nexo-ask .nx{margin-left:4px}
.icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.icon-opt{aspect-ratio:1; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--muted)}
.icon-opt.on{background:var(--mint); color:var(--mint-ink)}
.swatches{display:flex; gap:12px; flex-wrap:wrap}
.sw{width:42px; height:42px; border-radius:13px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw.t-dark{background:var(--surface2)}
.sw.on{outline:2px solid var(--mint); outline-offset:3px}

/* settings */
.set-row{display:flex; align-items:center; gap:14px; width:100%; padding:14px 14px 14px 0; border-bottom:1px solid var(--line); text-align:left; font-size:16px}
.set-row:last-child{border-bottom:0}
.set-row > .ic{color:var(--muted)}
.set-row span.nm{flex:1}
.set-row.danger, .set-row.danger > .ic{color:var(--danger)}
.me-card{display:flex; align-items:center; gap:14px; margin-top:14px}
.me-card .avatar{width:64px; height:64px}
.me-card .nm{font-size:20px; font-weight:600}
.help{font-size:14px; color:var(--muted); margin:10px 4px 0}
.steps{margin:10px 0 0; padding-left:20px; font-size:15px}
.steps li{margin:5px 0}

/* onboarding */
#onb{position:fixed; inset:0; z-index:40; background:var(--bg); overflow:auto; padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#onb::before{content:''; position:fixed; left:-30%; right:-30%; top:-20vh; height:60vh; pointer-events:none; background:radial-gradient(40% 45% at 25% 45%, rgba(106,0,255,.45), transparent 70%), radial-gradient(32% 40% at 80% 30%, rgba(16,16,255,.35), transparent 70%), radial-gradient(26% 32% at 55% 72%, rgba(138,247,149,.14), transparent 70%); filter:blur(30px)}
.onb{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative}
.prog{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 0 32px}
.prog i{display:block; height:100%; background:linear-gradient(90deg,var(--violet),var(--blue),var(--mint)); transition:width .35s}
.onb h2{font-size:30px; line-height:1.15; margin:0 0 10px; letter-spacing:-.025em}
.onb p{color:var(--muted); margin:0 0 18px}
.onb textarea.in{min-height:120px}
.onb .actions{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:26px}
.onb .skip{color:var(--muted); font-size:16px; padding:10px}
.brand{display:flex; align-items:center; gap:14px; margin:26px 0 26px}
.brand img{width:68px; height:68px; border-radius:18px; box-shadow:0 0 0 1px #2c2c30, 0 18px 40px rgba(106,0,255,.35)}
.brand .wm{font-size:40px; font-weight:600; letter-spacing:-.03em; line-height:1}
.brand .tag{font-size:14px; color:var(--muted); margin-top:4px}
.feat{display:flex; gap:14px; margin:14px 0; font-size:16px; align-items:center}
.feat b{display:block; font-weight:600}
.feat .em{flex:none; width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center}
.feat .em .ic, .feat .em svg{width:22px; height:22px}

/* toast */
#toast{position:fixed; left:50%; bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 78px); transform:translateX(-50%); background:var(--lav); color:var(--lav-ink); font-weight:500; padding:11px 16px; border-radius:14px; font-size:15px; z-index:50; width:max-content; max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s; box-shadow:0 10px 30px rgba(0,0,0,.4); display:flex; align-items:center; gap:14px}
#toast.show{opacity:1}
#toast.show.interactive{pointer-events:auto}
#toast button{font-weight:700; color:var(--violet)}
.spin{display:inline-block; width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:99px; animation:sp .7s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabbar" aria-label="Secciones">

  <button class="tab" data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>Listas</button>

/* ============================== toast + deshacer ============================== */
let toastT, UNDO = null;
function toast(msg, opt = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? '<button data-act="undo">Deshacer</button>' : ''}`;
  t.classList.toggle('interactive', !!opt.undo);
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), opt.undo ? 6000 : (opt.ms || 2600));

function snapshot() { UNDO = JSON.stringify(S); }
function undo() {
  if (!UNDO) return;

}
function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) { if (!btn.disabled) btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label ? ' ' + esc(label) : ''}`; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }

/* ============================== datos ============================== */

const DEFAULT_CATS = [

function freshData() {
  return { v: 2, onboarded: false, profile: { spouse: 'Maru', kids: 'Samantha' }, cats: DEFAULT_CATS.map((c) => ({ ...c })), items: [] };
}
function migrate(d) {
  // v1 → v2: iconos de línea en vez de emoji, colores editables, nombres de la familia
  const def = Object.fromEntries(DEFAULT_CATS.map((c) => [c.id, c]));
  d.cats.forEach((c, i) => {
    if (!c.icon || !ICONS[c.icon]) c.icon = def[c.id]?.icon || 'folder';
    if (!COLORS.includes(c.color)) c.color = def[c.id]?.color || ['lav', 'violet', 'mint', 'grad', 'dark', 'dark'][i % 6];
    delete c.emoji;
  });
  const g = d.cats.find((c) => c.id === 'goodies'); if (g && g.name === 'Goodies para mi esposa') g.name = 'Goodies para Maru';
  const p = d.cats.find((c) => c.id === 'perfil'); if (p && p.name === 'Sobre mí y mi familia') p.name = 'Familia y yo';
  d.profile = d.profile || {};
  if (!d.profile.spouse) d.profile.spouse = 'Maru';
  if (!d.profile.kids) d.profile.kids = 'Samantha';
  d.v = 2;
  return d;
}
function load() {
  try { const d = JSON.parse(lsGet(STORE)); if (d && Array.isArray(d.items) && Array.isArray(d.cats)) return migrate(d); } catch {}
  return freshData();
}
let S = load();
function save() { if (!lsSet(STORE, JSON.stringify(S))) toast('No se pudo guardar en el teléfono'); }

const catName = (id) => cat(id)?.name || 'Notas';
const catColor = (c) => (COLORS.includes(c.color) ? c.color : 'dark');
const spouse = () => (S.profile.spouse || '').trim();
const kid = () => (S.profile.kids || '').trim().split(/[\s,]/)[0] || '';
const getItem = (id) => S.items.find((i) => i.id === id);

function addItem(o) {
  const it = {
    id: uid(), title: String(o.title || '').trim().slice(0, 200), notes: String(o.notes || '').trim(),
    cat: cat(o.cat) ? o.cat : 'notas', date: isYmd(o.date) ? o.date : '', repeat: o.repeat === 'yearly' ? 'yearly' : '',
    kind: o.kind || '', done: false, created: Date.now(), updated: Date.now(), pkey: o.pkey || undefined,
  };
  if (!it.title) return null;
  S.items.push(it); return it;
}
function findCat(value) {
  if (!value) return null;
  if (cat(value)) return cat(value);
  return S.cats.find((c) => norm(c.name) === norm(value)) || null;
}
function ensureCategory(value, icon, color) {
  if (!value) return 'notas';
  const f = findCat(value); if (f) return f.id;
  const id = norm(value).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) + '-' + uid().slice(-4);
  S.cats.push({ id, name: String(value).slice(0, 40), icon: LIST_ICONS.includes(icon) ? icon : 'folder', color: COLORS.includes(color) ? color : 'dark' });
  return id;
}
function removeList(id) {
  const c = cat(id); if (!c || c.system) return;
  S.items.forEach((i) => { if (i.cat === id) i.cat = 'notas'; });
  S.cats = S.cats.filter((x) => x.id !== id);
}

/* fechas */
function effectiveDate(it) {
  if (!it.date) return null;
  let d = parseYmd(it.date);
  if (it.repeat === 'yearly') {
    const t = today0();
    d = new Date(t.getFullYear(), d.getMonth(), d.getDate());
    if (d < t) d.setFullYear(d.getFullYear() + 1);
  }
  return d;
}
function relDate(d) {
  const days = Math.round((d - today0()) / DAY);
  if (days === 0) return 'Hoy';
  if (days === 1) return 'Mañana';
  if (days === -1) return 'Ayer';
  if (days < 0) return `Vencido hace ${-days} días`;
  if (days < 7) return `En ${days} días`;
  const opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('es-MX', opts);
}
function dueClass(it) {
  const d = effectiveDate(it);
  if (!d || it.done) return '';
  if (d < today0()) return 'over';
  return d - today0() <= 3 * DAY ? 'soon' : '';
}
function upcoming(limit = 6) {
  return S.items.filter((i) => i.date && !i.done)
    .map((i) => [i, effectiveDate(i)]).filter(([, d]) => d - today0() <= 120 * DAY)
    .sort((a, b) => a[1] - b[1]).slice(0, limit).map(([i]) => i);
}
function sortItems(list) {
  return list.slice().sort((a, b) => {
    const da = effectiveDate(a), db = effectiveDate(b);
    if (da && db) return da - db;
    if (da) return -1; if (db) return 1;
    return b.created - a.created;
  });
}

  { k: 'spouseLikes', label: 'Gustos de {E}', q: '¿Qué le gusta a {E}? Perfumes, maquillaje, marcas, colores, flores…', ph: 'Ej: Rare Beauty, perfume Delina, tulipanes blancos' },

const fillE = (s) => s.replace(/\{E\}/g, spouse() || 'tu esposa').replace(/\{K\}/g, kid() || 'tu hija');

function syncProfileFacts() {
  S.items = S.items.filter((i) => !i.pkey);
  for (const q of QUESTIONS) {
    const v = (S.profile[q.k] || '').trim();

/* ============================== Gemini ============================== */
const API = 'https://generativelanguage.googleapis.com/v1beta';
const FALLBACK_MODELS = ['gemini-2.5-flash', 'gemini-flash-latest', 'gemini-2.5-flash-lite', 'gemini-flash-lite-latest'];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function gErr(msg, code) { const e = new Error(msg); e.code = code; return e; }
async function apiError(r) {
  let msg = '';
  try { msg = (await r.json()).error?.message || ''; } catch {}
  if (r.status === 400 && /api.?key/i.test(msg)) return gErr('La clave de Gemini no es válida. Revísala en Ajustes.', 'key');
  if (r.status === 401 || r.status === 403) return gErr('Gemini rechazó la clave (' + r.status + '). Verifica que esté activa.', 'key');
  if (r.status === 404) return gErr('Ese modelo no está disponible para tu clave.', 'model');
  if (r.status === 429) return gErr(/limit:\s*0|free_tier/i.test(msg) ? 'Este modelo no está incluido en tu plan gratuito.' : 'Llegaste al límite de uso de Gemini. Espera un minuto.', 'quota');
  if (r.status >= 500) return gErr('Gemini está saturado en este momento (' + r.status + ').', 'busy');
  return gErr('Gemini: ' + (msg || 'error ' + r.status), r.status === 400 ? 'bad' : 'other');
}
async function gfetch(url, opts = {}, ms = 45000) {
  for (let attempt = 0; ; attempt++) {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
    try { return await fetch(url, { ...opts, signal: ac.signal }); }
    catch (e) {
      if (e.name === 'AbortError') throw gErr('Gemini tardó demasiado en responder.', 'timeout');
      if (navigator.onLine === false) throw gErr('Sin conexión a internet.', 'offline');
      // iPhone corta a veces la conexión (cambio de red, app en segundo plano): reintenta una vez.
      if (attempt < 1) { await sleep(1200); continue; }
      throw gErr('Se cortó la conexión con Gemini. Mantén la app abierta e intenta de nuevo.', 'net');
    } finally { clearTimeout(t); }
  }
}
async function listModels(key) {
  const r = await gfetch(`${API}/models?pageSize=200`, { headers: { 'x-goog-api-key': key } }, 20000);
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  return (j.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map((m) => m.name.replace(/^models\//, ''))
    .filter((n) => /^gemini-/.test(n) && !/(image|tts|audio|live|embed|vision|computer|robotics|native|learnlm|exp)/.test(n));
}
/* Prefiere modelos Flash estables (rápidos y con capa gratuita); evita preview y Pro (lentos, con poco cupo gratis). */
function pickModel(names) {
  const score = (n) => {
    if (n === 'gemini-2.5-flash') return 1000;
    const m = n.match(/^gemini-(\d+(?:\.\d+)?)-(flash|pro)(-lite)?(.*)$/);
    if (!m) return -1;
    let s = parseFloat(m[1]) * 100 + (m[2] === 'pro' ? -300 : m[3] ? 20 : 50);
    if (m[4]) s -= 400;
    return s;
  };
  return names.slice().sort((a, b) => score(b) - score(a))[0] || 'gemini-2.5-flash';
}
/* Pensar mucho hace a Gemini lento (y en iPhone la conexión se corta): Nexo pide respuestas rápidas. */
function thinkingFor(model) {
  if (/gemini-3/.test(model)) return { thinkingLevel: /pro/.test(model) ? 'low' : 'minimal' };
  if (/2\.5-flash|flash-latest|flash-lite-latest/.test(model)) return { thinkingBudget: 0 };
  if (/2\.5-pro/.test(model)) return { thinkingBudget: 128 };
  return null;
}
let MODELS = [];
async function rawGenerate(model, key, body) {
  const b = JSON.parse(JSON.stringify(body));
  const th = thinkingFor(model);
  if (th) b.generationConfig.thinkingConfig = th;
  const post = () => gfetch(`${API}/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(b),
  });
  let r = await post();
  // 400 por configuración (pensamiento o esquema) en modelos que no la aceptan: reintenta más simple.
  if (r.status === 400) {
    const err = await apiError(r.clone());
    if (err.code === 'key') throw err;
    delete b.generationConfig.thinkingConfig; delete b.generationConfig.responseSchema;
    r = await post();
  }
  // Saturado: espera y reintenta una vez.
  if (r.status >= 500) { await sleep(2000); r = await post(); }
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  const txt = (j.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || '').join('');
  if (!txt) throw gErr('Gemini no respondió' + (j.promptFeedback?.blockReason ? ` (${j.promptFeedback.blockReason})` : '') + '.', 'empty');
  return { txt, cand: j.candidates[0] };
}
/* Usa el modelo elegido y, si falla por modelo/cupo/saturación, prueba los de respaldo y se queda con el que funcione. */
async function generate(body, key = getKey()) {
  const first = getModel();
  const chain = [first, ...FALLBACK_MODELS.filter((m) => m !== first && (!MODELS.length || MODELS.includes(m)))];
  let lastErr;
  for (const model of chain) {
    try {
      const res = await rawGenerate(model, key, body);
      if (model !== first) lsSet(MODEL_STORE, model);
      return res;
    } catch (e) {
      lastErr = e;
      if (!['model', 'quota', 'busy', 'timeout'].includes(e.code)) break;
    }
  }
  throw lastErr;
}
async function connectKey(k) {
  const names = await listModels(k);
  MODELS = names;
  const cur = lsGet(MODEL_STORE);
  if (!cur || !names.includes(cur)) lsSet(MODEL_STORE, pickModel(names));
  // Prueba real: que Gemini de verdad conteste con esta clave antes de decir "conectado".
  try {
    await generate({ contents: [{ role: 'user', parts: [{ text: 'Responde solo: {"ok":true}' }] }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } }, k);
  } catch (e) { if (e.code !== 'quota') throw e; }
  lsSet(KEY_STORE, k);
}
function parseJSON(txt) {
  try { return JSON.parse(txt); } catch {}
  const m = txt.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch {} }
  throw new Error('No entendí la respuesta de Gemini. Intenta de nuevo.');
}
async function gemini({ system, parts, history = [], schema }) {
  if (!getKey()) throw new Error('Conecta Gemini en Ajustes.');
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [...history, { role: 'user', parts }],
    generationConfig: { temperature: 0.4, responseMimeType: 'application/json' },
  };
  if (schema) body.generationConfig.responseSchema = schema;
  return parseJSON((await generate(body)).txt);
}

const shopWhere = () => (S.profile.shopWhere || '').trim();
const URL_RE = /https?:\/\/[^\s<>"'`)\]]+[^\s<>"'`)\].,;:!?]/g;
const domainOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
async function webSearch(query, original) {

Para productos: una línea por opción con nombre exacto (marca, presentación/tamaño), tienda, precio y la URL directa de la página del producto. Ordena del mejor precio al más alto. Máximo 8 opciones. Si un precio no es seguro, dilo.

    contents: [{ role: 'user', parts: [{ text: `Busca: ${query}\n\nPetición original del usuario: ${original}` }] }],
    tools: [{ google_search: {} }],
    generationConfig: { temperature: 0.2 },

  const { txt, cand } = await generate(body);

/* Nexo entiende comandos: guardar, editar, mover, completar, borrar, organizar listas o responder */
const OPS = ['add', 'update', 'done', 'undone', 'delete', 'add_list', 'update_list', 'delete_list'];
const ACTION_SCHEMA = {
  type: 'OBJECT',
  properties: {
    op: { type: 'STRING', enum: OPS },
    id: { type: 'STRING' }, title: { type: 'STRING' }, category: { type: 'STRING' }, date: { type: 'STRING' },
    notes: { type: 'STRING' }, repeat: { type: 'STRING' }, name: { type: 'STRING' }, icon: { type: 'STRING' }, color: { type: 'STRING' },
  },
  required: ['op'],
};
const CMD_SCHEMA = { type: 'OBJECT', properties: { reply: { type: 'STRING' }, web: { type: 'STRING' }, actions: { type: 'ARRAY', items: ACTION_SCHEMA } }, required: ['reply', 'actions'] };

function todayLine() {

      (i.notes ? ` — ${i.notes.replace(/\s*\n\s*/g, ' / ')}` : '') +
      ` {guardado ${ymd(new Date(i.created))}}`
    ).join('\n');

  return out.join('\n\n');
}
function commandSystem(web = null) {
  return `Eres Nexo, el "segundo cerebro" personal del usuario. ${whoLine()} ${todayLine()}
El usuario te escribe para: (a) guardar información nueva, (b) cambiar, mover, completar o borrar cosas que ya guardó, (c) organizar sus listas, o (d) preguntarte algo sobre su memoria. A veces comparte correos o capturas de pantalla.

Tu estilo: directo, práctico y con energía de alguien que construye. Piensas como alguien que usa la IA para ganar tiempo y enfocarse en lo que importa: la familia, el trabajo creativo y avanzar. Nada de relleno; prioriza lo accionable. Si ves algo útil (una fecha que se acerca, un regalo pendiente, algo vencido), sugiérelo de forma proactiva.

Responde con JSON:
- reply: respuesta breve en español, cálida y práctica. Usa "- " para viñetas y **negritas** para lo clave. Si propones cambios, resume en una frase qué vas a hacer. Si es una pregunta, respóndela SOLO con base en la memoria (puedes razonar y recomendar, citando de dónde sale); si el dato no está, dilo y sugiere qué agregar.
- actions: lista de cambios a proponer (vacía si solo es una pregunta). Operaciones:
  · add: elemento nuevo → title, category, date, notes, repeat.
  · update: editar un elemento existente → id (el [id:...] de la memoria) + SOLO los campos que cambian. Usa category para moverlo a otra lista. date "none" quita la fecha. notes reemplaza las notas completas (conserva lo anterior si sigue siendo útil). repeat "yearly" o "none".
  · done / undone: marcar como hecho o pendiente → id.

  · update_list: renombrar o cambiar icono/color de una lista → id de la lista + name/icon/color.
  · delete_list: borrar una lista (sus elementos pasan a Notas) → id. Nunca borres listas fijas.

Reglas:
- category: id de una lista existente, o el nombre de una lista nueva (en ese caso agrega también un add_list con su icon y color).
- Divide la información nueva en elementos individuales y útiles (ej. cada útil escolar o producto). Si son muchos, agrupa con sentido (máx ~25).
- Lo que ${spouse() || 'su esposa'} menciona que le gustaría o le encanta va en "regalos". Maquillaje, perfumes o caprichos para comprarle van en "goodies".
- Datos sobre el usuario o su familia (tallas, gustos, alergias, colegio) van en "perfil".
- date en formato YYYY-MM-DD solo si hay una fecha real o límite. Para compras con fecha límite (ej. útiles antes del inicio de clases) propone una fecha tentativa de compra 10 a 14 días antes y explica en notes la fecha límite real.
- Si el usuario dice "eso", "lo anterior", "el último", usa la conversación y la memoria para identificar el elemento. Si no estás seguro de a cuál se refiere, pregúntalo en reply y no propongas acciones.

- Iconos disponibles para listas: ${LIST_ICONS.join(', ')}. Colores: ${COLORS.join(', ')}.
${!webOn() ? '- No tienes acceso a internet (el usuario lo desactivó en Ajustes). Si pide algo de internet, díselo y sugiere activarlo.' : web ? `
INTERNET: ya buscaste "${web.query}". RESULTADOS:
${web.text}
FUENTES:
${web.sources.map((x) => `- ${x.title}: ${x.uri}`).join('\n') || '(sin fuentes)'}
Con estos resultados: responde en reply con lo más útil (mejor precio primero, tienda y precio). Si el usuario pidió guardar, armar una lista o "buscar y guardar", propone actions add en la lista que corresponda (crea la lista con add_list si no existe, ej. mascotas → icon paw). En notes pon tienda, precio con moneda, fecha de hoy y el link. Para el link usa la URL directa del producto si aparece en RESULTADOS; si no, usa la de FUENTES de esa tienda. Nunca inventes links ni precios. Deja web vacío.` : `- Tienes acceso a internet con Google. Si para cumplir la petición necesitas información actual de internet (precios, ofertas, tiendas, links, disponibilidad, clima, horarios, noticias, datos de lugares) pon en web una búsqueda concreta (producto, marca, presentación, país) y deja actions vacío; reply: una frase corta. Antes de buscar usa la memoria para afinar (ej. marca de croquetas de la mascota, perfumes que le gustan). Si es solo sobre su memoria, deja web vacío.`}

MEMORIA DEL USUARIO:
${memoryText()}`;
}
function cleanActions(list) {
  const out = [];
  for (const a of Array.isArray(list) ? list : []) {
    if (!a || !OPS.includes(a.op)) continue;
    const x = {
      op: a.op, id: String(a.id || '').replace(/^id:/, '').trim(),
      title: String(a.title || '').trim().slice(0, 200), category: String(a.category || '').trim(),
      date: a.date === 'none' ? 'none' : isYmd(a.date) ? a.date : '',
      notes: String(a.notes || '').trim(), repeat: a.repeat === 'yearly' || a.repeat === 'none' ? a.repeat : '',
      name: String(a.name || '').trim().slice(0, 40), icon: LIST_ICONS.includes(a.icon) ? a.icon : '', color: COLORS.includes(a.color) ? a.color : '',
    };
    if (x.op === 'add' && !x.title) continue;
    if (['update', 'done', 'undone', 'delete'].includes(x.op) && !getItem(x.id)) continue;
    if (x.op === 'add_list' && !x.name) continue;
    if (['update_list', 'delete_list'].includes(x.op) && !cat(x.id)) continue;
    if (x.op === 'delete_list' && cat(x.id).system) continue;
    out.push(x);
  }
  return out.slice(0, 40);
}
async function aiCommand(text, img, history = [], onStatus) {
  const parts = [];
  if (img) parts.push({ inlineData: { mimeType: img.mimeType, data: img.data } });
  parts.push({ text: text || 'Extrae la información importante de esta imagen y guárdala.' });
  let r = await gemini({ system: commandSystem(), parts, history, schema: CMD_SCHEMA });
  let web = null;
  const q = String(r.web || '').trim();
  if (q && webOn()) {
    onStatus?.('Buscando en internet…');
    try { web = await webSearch(q, text || ''); }
    catch (e) { return { reply: 'No pude buscar en internet: ' + e.message, actions: [] }; }
    onStatus?.('Armando la respuesta…');
    r = await gemini({ system: commandSystem(web), parts, history, schema: CMD_SCHEMA });
  }
  return { reply: String(r.reply || ''), actions: cleanActions(r.actions), sources: web?.sources || [], entry: web?.entry || '' };
}

function localClassify(text) {
  const n = norm(text);
  const hit = RULES.find(([re, id]) => re.test(n) && cat(id));
  const lines = text.trim().split('\n');
  const first = lines[0].slice(0, 120);
  const rest = (lines[0].length > 120 ? lines[0].slice(120) + '\n' : '') + lines.slice(1).join('\n');
  const c = hit ? hit[1] : 'notas';
  return [{ op: 'add', title: first, notes: rest.trim(), category: c, date: '', repeat: '' }];
}
function localSearch(q) {
  const STOP = new Set(['que', 'cual', 'cuales', 'como', 'para', 'por', 'los', 'las', 'del', 'una', 'uno', 'con', 'tengo', 'mis', 'hay', 'esta', 'este', 'donde', 'cuando', 'quien', 'le']);
  const words = norm(q).split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !STOP.has(w));
  if (!words.length) return [];
  return S.items
    .map((i) => { const h = norm(`${i.title} ${i.notes} ${catName(i.cat)}`); return [i, words.filter((w) => h.includes(w)).length]; })
    .filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12).map((x) => x[0]);
}

function signals() {

  const dated = S.items.filter((i) => i.date && !i.done).map((i) => [i, effectiveDate(i)]);
  const over = dated.filter(([i, d]) => d < t && i.repeat !== 'yearly');
  if (over.length) out.push({ icon: 'alert', cls: 'warn', id: over.length === 1 ? over[0][0].id : '', html: over.length === 1 ? `Vencido: <b>${esc(over[0][0].title)}</b>` : `<b>${over.length} cosas vencidas</b>. Resuélvelas o cámbiales la fecha.` });
  const week = dated.filter(([i, d]) => d >= t && d - t <= 7 * DAY && i.repeat !== 'yearly').sort((a, b) => a[1] - b[1]);
  if (week.length) out.push({ icon: 'calendar', cls: 'soon', id: week[0][0].id, html: `<b>${esc(week[0][0].title)}</b> · ${relDate(week[0][1]).toLowerCase()}${week.length > 1 ? ` <span class="muted">(+${week.length - 1} esta semana)</span>` : ''}` });
  const events = dated.filter(([i, d]) => i.repeat === 'yearly' && d - t <= 21 * DAY).sort((a, b) => a[1] - b[1]);
  for (const [i, d] of events.slice(0, 2)) {

  return out;
}

function linkify(html) {
  // [texto](url) y URLs sueltas → links que abren en Safari
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => `<a class="lnk" href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return html.replace(/(^|[^"'>=])(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)])/g, (m, pre, u) => `${pre}<a class="lnk" href="${u}" target="_blank" rel="noopener">${esc(domainOf(u.replace(/&amp;/g, '&')))}</a>`);
}
function sourcesHtml(m) {
  if (!m.sources?.length && !m.entry) return '';
  const chips = (m.sources || []).map((x) => `<a class="src" href="${esc(x.uri)}" target="_blank" rel="noopener">${ic('globe')}<span>${esc(x.title)}</span></a>`).join('');
  const gse = m.entry ? `<iframe class="gse" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc('<meta name=color-scheme content=dark><base target=_blank><style>html,body{margin:0;background:transparent;color-scheme:dark}</style>' + m.entry)}"></iframe>` : '';
  return `<div class="srcs">${chips}</div>${gse}`;
}
function mdLite(s) {
  const lines = linkify(esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')).split('\n');
  let html = '', inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (l.trim()) html += `<p>${l}</p>`;
  }
  return html + (inList ? '</ul>' : '');
}

function changeRow(a, k) {
  const it = getItem(a.id), c = cat(a.id);
  const L = { update: 'Editar', done: 'Marcar como hecho', undone: 'Marcar pendiente', delete: 'Eliminar', add_list: 'Lista nueva', update_list: 'Editar lista', delete_list: 'Eliminar lista' };
  let title = '', diff = [];
  if (['update', 'done', 'undone', 'delete'].includes(a.op)) title = it.title;
  if (a.op === 'update') {

    if (a.repeat) diff.push(`Repetir cada año: <b>${a.repeat === 'yearly' ? 'sí' : 'no'}</b>`);
    if (a.notes) diff.push(`Notas: <b>${esc(a.notes)}</b>`);
  }
  if (a.op === 'add_list') { title = a.name; diff.push(`${a.icon ? 'Icono ' + ic(a.icon, 'xs') + ' · ' : ''}${COLOR_NAMES[a.color || 'dark']}`); }
  if (a.op === 'update_list') {
    title = c.name;
    if (a.name && a.name !== c.name) diff.push(`Nombre: <b>${esc(a.name)}</b>`);
    if (a.icon) diff.push(`Icono: ${ic(a.icon, 'xs')}`);
    if (a.color) diff.push(`Color: <b>${COLOR_NAMES[a.color]}</b>`);
  }
  if (a.op === 'delete_list') { title = c.name; diff.push('Sus elementos pasarán a Notas'); }
  return `<div class="pv" data-k="${k}">
    <input type="checkbox" checked aria-label="Incluir">

      ${diff.length ? `<div class="ch-diff">${diff.map((d) => `<span>${d}</span>`).join('')}</div>` : ''}
    </div></div>`;

function applyReview() {
  if (!REVIEW) return;
  const { actions, onDone } = REVIEW;
  const rowOf = (k) => $(`#sheet .pv[data-k="${k}"]`);
  const on = (k) => $('input[type=checkbox]', rowOf(k)).checked;
  snapshot();
  let n = 0;
  actions.forEach((a, k) => {
    if (!on(k)) return;
    if (a.op === 'add_list') { ensureCategory(a.name, a.icon, a.color); n++; }
    if (a.op === 'update_list') { const c = cat(a.id); if (!c) return; if (a.name) c.name = a.name; if (a.icon) c.icon = a.icon; if (a.color) c.color = a.color; n++; }
  });
  actions.forEach((a, k) => {
    if (!on(k)) return;
    const row = rowOf(k);
    if (a.op === 'add') {
      const v = $('.pv-cat', row).value;
      const catId = v.startsWith('new:') ? ensureCategory(v.slice(4)) : v;
      if (addItem({ title: $('.pv-title', row).value, cat: catId, date: $('.pv-date', row).value, notes: $('.pv-notes', row).value, repeat: a.repeat })) n++;
      return;
    }
    const it = getItem(a.id);
    if (!it) return;
    if (a.op === 'update') {
      if (a.title) it.title = a.title;
      if (a.category) it.cat = ensureCategory(a.category);
      if (a.date === 'none') it.date = ''; else if (a.date) it.date = a.date;
      if (a.notes) it.notes = a.notes;
      if (a.repeat === 'yearly') it.repeat = 'yearly'; else if (a.repeat === 'none') it.repeat = '';
      if (it.pkey) { delete S.profile[it.pkey]; delete it.pkey; }
    }
    if (a.op === 'done') it.done = true;
    if (a.op === 'undone') it.done = false;
    if (a.op === 'delete') { if (it.pkey) delete S.profile[it.pkey]; S.items = S.items.filter((x) => x !== it); }
    it.updated = Date.now(); n++;
  });
  actions.forEach((a, k) => { if (on(k) && a.op === 'delete_list' && cat(a.id)) { removeList(a.id); n++; } });
  save(); closeSheet(); REVIEW = null;
  if (n && onDone) onDone();
  render();
  toast(n ? `${n} cambio${n > 1 ? 's' : ''} aplicado${n > 1 ? 's' : ''}` : 'No se aplicó nada', n ? { undo: true } : {});
}

/* ============================== acciones ============================== */
async function runNexo(text, btn, img = null) {
  setBusy(btn, true);
  try { return await aiCommand(text, img, chatHistory(), (st) => setBusy(btn, true, st)); }
  catch (e) { toast(e.message, { ms: 4000 }); return null; }
  finally { setBusy(btn, false); }
}
function chatHistory() {
  return CHAT.filter((m) => !m.thinking && m.text).slice(-10)
    .map((m) => ({ role: m.role === 'me' ? 'user' : 'model', parts: [{ text: m.text }] }));
}
async function doCapture(btn) {
  const text = $('#capText').value.trim();
  const img = pendingImg;
  if (!text && !img) return toast('Escribe algo o agrega una foto');
  const clear = () => { pendingImg = null; const t = $('#capText'); if (t) t.value = ''; };
  if (!hasAI()) {
    if (img) return toast('Para leer fotos, conecta Gemini en Ajustes');
    return openReview(localClassify(text), '', clear);
  }
  const r = await runNexo(text, btn, img);
  if (!r) { if (text) openReview(localClassify(text), 'Sin IA en este momento: revisa antes de guardar.', clear); return; }
  if (r.actions.length) return openReview(r.actions, r.reply, clear);
  // sin cambios: fue una pregunta → la respuesta va al chat
  CHAT.push({ role: 'me', text: text || '(imagen)' }, { role: 'bot', text: r.reply || 'No encontré nada que guardar.', sources: r.sources, entry: r.entry });
  pendingImg = null;
  go('ask');
}
async function doAsk(q) {
  q = q.trim(); if (!q) return;
  if (!hasAI()) {
    CHAT.push({ role: 'me', text: q });
    const found = localSearch(q);
    CHAT.push({ role: 'bot', text: '', html: found.length
      ? `<p>Encontré esto en tu memoria:</p><div class="list" style="padding:0">${found.map((i) => itemRow(i)).join('')}</div>`
      : '<p>No encontré nada con esas palabras. Conecta Gemini en Ajustes para respuestas más inteligentes.</p>' });
    return render();
  }
  const history = chatHistory();
  CHAT.push({ role: 'me', text: q });
  const thinking = { role: 'bot', thinking: true };
  CHAT.push(thinking); render();
  try {
    const r = await aiCommand(q, null, history, (st) => { thinking.status = st; if (UI.tab === 'ask') render(); });
    Object.assign(thinking, { thinking: false, text: r.reply || (r.actions.length ? 'Te propongo estos cambios.' : 'Listo.'), actions: r.actions, sources: r.sources, entry: r.entry });
  } catch (e) {
    Object.assign(thinking, { thinking: false, text: 'Hubo un problema: ' + e.message });
  }
  if (UI.tab === 'ask') render();
}
async function askAbout(prefix, input, btn) {
  const t = input.value.trim();
  if (!t) return toast('Escribe qué quieres que haga Nexo');
  const r = await runNexo(`${prefix} ${t}`, btn);
  if (!r) return;
  if (r.actions.length) { closeSheet(); openReview(r.actions, r.reply, () => { input.value = ''; }); }
  else if (r.sources?.length) { closeSheet(); input.value = ''; CHAT.push({ role: 'me', text: t }, { role: 'bot', text: r.reply, sources: r.sources, entry: r.entry }); go('ask'); }
  else toast(r.reply || 'No encontré cambios que hacer', { ms: 5000 });
}

async function fileToJpeg(file, max = 2400) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    let w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const data = c.toDataURL('image/jpeg', 0.85);
    return { mimeType: 'image/jpeg', data: data.split(',')[1], preview: data };
  } finally { URL.revokeObjectURL(url); }
}
async function shareOrDownload(name, text, type, preferShare) {
  const blob = new Blob([text], { type });
  if (preferShare) {
    try {
      const file = new File([blob], name, { type });
      if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function icsFor(it) {
  const e = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const start = parseYmd(it.date); const end = new Date(start); end.setDate(end.getDate() + 1);
  const f = (d) => ymd(d).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nexo//ES', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${it.id}@nexo`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${f(start)}`, `DTEND;VALUE=DATE:${f(end)}`,
    `SUMMARY:${e(it.title)}`, it.notes ? `DESCRIPTION:${e(it.notes)}` : '', it.repeat === 'yearly' ? 'RRULE:FREQ=YEARLY' : '',
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(it.title)}`, 'TRIGGER:-PT15H', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) return go(tab.dataset.tab);
  const onb = e.target.closest('[data-onb]');
  if (onb) return onbAction(onb.dataset.onb);
  const pi = e.target.closest('[data-pick-icon]');
  if (pi) { $$('[data-pick-icon]', pi.parentElement).forEach((b) => b.classList.toggle('on', b === pi)); return; }
  const pc = e.target.closest('[data-pick-color]');
  if (pc) { $$('[data-pick-color]', pc.parentElement).forEach((b) => b.classList.toggle('on', b === pc)); return; }
  if (e.target.closest('[data-close]')) return closeSheet();
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a); }
});
document.addEventListener('submit', (e) => {
  const form = e.target, f = form.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'quickAdd') {
    const v = $('#quickIn').value.trim(); if (!v) return;
    addItem({ title: v, cat: UI.cat }); save(); render();
    setTimeout(() => $('#quickIn')?.focus(), 0);
  } else if (f === 'ask') {
    const v = $('#askIn').value; $('#askIn').value = ''; doAsk(v);
  } else if (f === 'itemAsk') {
    const it = getItem(form.dataset.id); if (!it) return;
    askAbout(`Sobre el elemento [id:${it.id}] "${it.title}":`, $('#edAsk'), $('button', form));
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'onbIn' && e.target.tagName === 'INPUT') { e.preventDefault(); onbAction('next'); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
});
$('#fileImg').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const keep = $('#capText')?.value || '';
  try { pendingImg = await fileToJpeg(f); render(); $('#capText').value = keep; }
  catch { toast('No pude abrir esa imagen'); }
});
$('#fileAvatar').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const j = await fileToJpeg(f, 360);
    if (!lsSet(AVATAR_STORE, j.preview)) throw new Error();
    render(); toast('Avatar actualizado');
  } catch { toast('No pude usar esa imagen'); }
});
$('#fileBackup').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.cats)) throw new Error();
    if (!confirm(`Este respaldo tiene ${d.items.length} elementos. Reemplazará tu memoria actual. ¿Continuar?`)) return;
    snapshot(); S = migrate(d); S.onboarded = true; save(); render(); toast('Respaldo importado', { undo: true });
  } catch { toast('Ese archivo no es un respaldo válido'); }
});

/* ============================== inicio ============================== */
save();
render();
if (!S.onboarded) openOnboarding(0);
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
